# ServiceAccount usada pelos pods runner do ARC + permissão para fazer deploy da app.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arc-runner
  namespace: arc-runners
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actions-demo-deployer
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [secrets, services, pods, pods/log, pods/attach]
    verbs: ["*"]
  - apiGroups: [apps]
    resources: [deployments, deployments/status, replicasets]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actions-demo-deployer
subjects:
  - kind: ServiceAccount
    name: arc-runner
    namespace: arc-runners
roleRef:
  kind: ClusterRole
  name: actions-demo-deployer
  apiGroup: rbac.authorization.k8s.io
