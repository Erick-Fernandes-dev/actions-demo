# =====================================================================
# CI — roda em todo push na main e em todo Pull Request.
# Fluxo: lint -> test (matriz) + security (não bloqueante) -> build/push da imagem
#        -> deploy em staging (workflow reutilizável, runner self-hosted) -> notify
# =====================================================================
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]      # commits só de doc não disparam pipeline
  pull_request:
    branches: [main]
  workflow_dispatch:                          # botão "Run workflow" na aba Actions

# Se um novo push chegar no mesmo branch/PR, cancela a execução anterior (economiza minutos)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Princípio do menor privilégio para o GITHUB_TOKEN
permissions:
  contents: read
  packages: write        # publicar imagem no GitHub Container Registry (ghcr.io)
  pull-requests: write   # comentar no PR

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest            # runner compartilhado (hospedado pelo GitHub)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip                  # cacheia ~/.cache/pip entre execuções
      - run: pip install ruff
      - run: ruff check app/

  # ------------------------------------------------------------------
  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: lint                       # só roda se lint passou
    strategy:
      fail-fast: false                # uma versão falhando não cancela as outras
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest
        run: pytest --cov=app --cov-report=xml --junitxml=junit-${{ matrix.python }}.xml
      - name: Upload test report
        if: always()                  # sobe o relatório mesmo se os testes falharem
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python }}
          path: |
            junit-*.xml
            coverage.xml
          retention-days: 7

  # ------------------------------------------------------------------
  security:
    name: Security scan (não bloqueante)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true           # <- job pode falhar sem derrubar o workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

      # Exemplo de continue-on-error no nível do STEP, com leitura do resultado:
      - name: Scan experimental (pode falhar)
        id: experimental
        continue-on-error: true
        run: |
          echo "simulando ferramenta instável..."
          exit 1
      - name: Reportar resultado do step anterior
        run: |
          echo "outcome=${{ steps.experimental.outcome }}"      # failure
          echo "conclusion=${{ steps.experimental.conclusion }}" # success (por causa do continue-on-error)
          echo "::warning title=Scan experimental::step falhou mas foi tolerado"

  # ------------------------------------------------------------------
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name != 'pull_request'   # em PR só valida; imagem só em push/dispatch
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}   # exposto para jobs seguintes
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # token automático, sem criar secret

      - name: Gerar tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (local) para smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test da imagem
        run: |
          docker run -d --name smoke -p 8000:8000 ${{ env.IMAGE_NAME }}:smoke
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && break || sleep 1
          done
          curl -fsS http://localhost:8000/health | grep '"status":"ok"'
          docker logs smoke
          docker rm -f smoke

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha

      - name: Resumo da execução
        run: |
          {
            echo "### Imagem publicada :rocket:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging
    needs: build
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml       # workflow reutilizável
    with:
      environment: staging
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  # ------------------------------------------------------------------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint, test, security, build, deploy-staging]
    if: always()                       # roda sempre, mesmo com falha/skip acima
    steps:
      - name: Status consolidado
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          echo "security=${{ needs.security.result }}"
          echo "build=${{ needs.build.result }}"
          echo "deploy-staging=${{ needs.deploy-staging.result }}"
      - name: Alertar falha
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::Pipeline falhou em ${{ github.sha }}"
          # aqui entraria Slack/Teams/e-mail, ex.: slackapi/slack-github-action
